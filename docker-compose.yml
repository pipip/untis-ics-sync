services:
  server:
    image: ghcr.io/pipip/untis-ics-sync:latest
    #build:
    #  context: ./untis-ics-sync/
    #  dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      UNTIS_SCHOOLNAME:
      UNTIS_USERNAME:
      UNTIS_PASSWORD:
      UNTIS_BASEURL:
      BULL_REDIS_HOST: redis
      BULL_REDIS_PORT: 6379
    ports:
      - 3000:3000
    networks:
      - untis
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server
    volumes:
      - redis-data:/data
    networks:
      - untis

volumes:
  redis-data:

networks:
  untis:
    external: false
